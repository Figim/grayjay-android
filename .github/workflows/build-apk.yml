name: Build Nightly APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix submodule URLs and initialize
        run: |
          # Submodul ünvanlarını rəsmi public mənbələrə yönəldirik
          git config submodule.dep/polycentricandroid.url https://gitlab.futo.org/videostreaming/polycentricandroid.git || true
          git config submodule.dep/futopay.url https://gitlab.futo.org/videostreaming/futopay.git || true
          
          # Submodulları yeniləyirik
          git submodule update --init dep/polycentricandroid dep/futopay

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grayjay-Nightly-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
