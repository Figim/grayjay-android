name: Build Grayjay Nightly APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone official FUTO GitLab repository with all submodules
        run: |
          git clone --recurse-submodules https://gitlab.futo.org/videostreaming/grayjay.git .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Yaddaş limitini artırmaq üçün bu hissəni əlavə edirik:
      - name: Increase Gradle and Kotlin Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> gradle.properties

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grayjay-Nightly-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
